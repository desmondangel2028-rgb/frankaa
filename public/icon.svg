<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="flag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer gold circle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="12" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Flagpole & Banner ("Franka" = Banner) -->
  <!-- Pole -->
  <rect x="150" y="100" width="16" height="312" rx="8" fill="url(#gold)" />
  <circle cx="158" cy="94" r="16" fill="url(#gold)" />
  
  <!-- Banner Wave -->
  <path d="M 166 110 Q 230 80, 290 120 T 400 110 L 400 230 Q 310 210, 270 250 T 166 230 Z" fill="url(#gold)" opacity="0.95" />
  
  <!-- Cedi / Trade Symbol in Banner -->
  <text x="270" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#065f46" text-anchor="middle">GH₵</text>

  <!-- Stock / Shopping / Prosperity Growth Bars -->
  <rect x="200" y="340" width="30" height="70" rx="6" fill="#34d399" />
  <rect x="250" y="300" width="30" height="110" rx="6" fill="#6ee7b7" />
  <rect x="300" y="270" width="30" height="140" rx="6" fill="#a7f3d0" />
  <rect x="350" y="230" width="30" height="180" rx="6" fill="url(#gold)" />

  <!-- Rising Growth Arrow -->
  <path d="M 190 350 L 375 210 M 375 210 L 340 210 M 375 210 L 375 245" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
